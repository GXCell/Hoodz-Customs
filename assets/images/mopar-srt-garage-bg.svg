<svg width="1920" height="1280" viewBox="0 0 1920 1280" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Custom garage background</title>
  <desc id="desc">A realistic-style custom garage scene with a modern muscle coupe and cinematic lighting.</desc>
  <defs>
    <linearGradient id="bg" x1="145" y1="60" x2="1772" y2="1136" gradientUnits="userSpaceOnUse">
      <stop stop-color="#152636" />
      <stop offset="0.52" stop-color="#08121D" />
      <stop offset="1" stop-color="#03070D" />
    </linearGradient>
    <linearGradient id="wallGlow" x1="480" y1="230" x2="1418" y2="372" gradientUnits="userSpaceOnUse">
      <stop stop-color="#2BE0FF" stop-opacity="0.22" />
