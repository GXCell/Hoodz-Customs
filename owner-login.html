<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Owner login for Hoodz Customs dashboard." />
    <title>Hoodz Customs Owner Login</title>
    <link rel="stylesheet" href="styles.css" />
    <link rel="stylesheet" href="owner.css" />
    <script src="owner.js" defer></script>
  </head>
  <body data-page="owner-login">
    <main class="owner-shell">
      <section class="owner-panel">
        <p class="eyebrow">Owner Access</p>
        <h1>Sign in to dashboard</h1>
        <p class="owner-subtext">Manage shop email shortcuts and launch ARI invoicing tools.</p>

        <form id="owner-login-form" class="owner-form">
          <label for="owner-username">Username</label>
          <input id="owner-username" name="username" type="text" autocomplete="username" required />

          <label for="owner-password">Password</label>
          <input
            id="owner-password"
            name="password"
            type="password"
            autocomplete="current-password"
            required
          />

          <button type="submit" class="button button-primary">Log in</button>
          <p id="owner-login-error" class="owner-error" aria-live="polite"></p>
        </form>

        <a class="owner-backlink" href="index.html">Return to website</a>
      </section>
    </main>
  </body>
</html>
